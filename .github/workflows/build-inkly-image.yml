name: Build Inkly CWA Image

on:
  workflow_dispatch:
  push:
    branches:
      - inkly-integration

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/golitedev/calibre-web-automated
          tags: |
            type=raw,value=inkly-latest
            type=sha,prefix=inkly-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # The full image currently depends on Launchpad's deadsnakes PPA,
          # which can prevent an urgent application-only fix from publishing.
          file: ./Dockerfile.inkly-hotfix
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=inkly-${{ github.sha }}
